<!DOCTYPE html><html><head><title>Admin Logs</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.log{background:white;padding:12px;margin:8px 0;border-radius:8px;border-left:4px solid red}</style></head><body><h2>🔒 Admin Error Logs</h2><div id="logs"></div><script>const pass=prompt("Enter Admin Password:");if(pass!=="SparkAdmin2026@"){document.body.innerHTML="<h1>Access Denied</h1>";throw new Error("Denied")}const logs=JSON.parse(localStorage.getItem('app_errors')||'[]');const container=document.getElementById('logs');if(!logs.length)container.innerHTML="<p>No errors yet - All Good ✅</p>";else logs.forEach(l=>{container.innerHTML+=`<div class="log"><b>${l.type}</b> - ${l.time}<br>${l.message}<br><small>${l.url}</small></div>`});</script></body></html>
